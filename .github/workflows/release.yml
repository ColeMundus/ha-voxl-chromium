name: Source release

# Source-build distribution only. Do not add a registry login, image push,
# docker-save artifact, or HA image key until binary-source delivery is solved.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  UV_LOCKED: 'true'

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate version and source-only policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - name: Require v{config.yaml version}; reject prebuilt image configuration
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path('voxl_chromium/config.yaml').read_text())
          version = str(config['version'])
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Add-on version must be stable x.y.z')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Tag does not match voxl_chromium/config.yaml version')
          if 'image' in config:
              raise SystemExit('Source-only release must not configure an image key')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

  tests:
    name: Required release tests
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  sources:
    name: Package tracked project and checksum-verified upstream sources
    needs: [validate, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive the exact tagged project source
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="ha-voxl-chromium-${RELEASE_VERSION}/" \
            --output="dist/ha-voxl-chromium-${RELEASE_VERSION}-source.tar.gz" HEAD
      - name: Fetch and verify the exact upstream archive; include dependency lock
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/package_sources.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish source assets only
    needs: [validate, tests, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-release
          path: dist
      - name: Publish verified source release (never images)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file dist/SOURCE-NOTICE.txt --draft=false --prerelease=false \
            dist/*
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets
