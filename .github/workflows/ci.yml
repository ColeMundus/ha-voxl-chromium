name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '47 8 * * 1'

permissions:
  contents: read

env:
  UV_LOCKED: 'true'
  TRIVY_IMAGE: ha-voxl-scanner:ci

jobs:
  metadata:
    name: Add-on, integration and HACS validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./voxl_chromium
          community: false
      - name: Validate integration with hassfest
        run: |
          docker run --rm -v "$PWD:/github/workspace" \
            ghcr.io/home-assistant/hassfest@sha256:f9ac52cfe0f7b8770334f191e6713aa9f10f0906a989bd38d75a4933534144c7
      - name: Validate HACS custom repository
        uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        with:
          category: integration
          github_token: ${{ github.token }}
          comment: false

  python:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked --project integration_tests
      - run: uv run --project integration_tests pytest integration_tests

  container:
    name: Native build and smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - name: Build ephemeral source image (never pushed or uploaded)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: voxl_chromium
          load: true
          push: false
          tags: ha-voxl-chromium:test
          provenance: false
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          # A GitHub Actions layer cache is not a registry push. Pull requests
          # only read. Main and the weekly schedule write, and they rebuild
          # the apt stages so the vulnerability scan sees current packages.
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=native-{0}', matrix.arch) || '' }}
          pull: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
          no-cache-filters: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && 'builder-apt,runtime-apt' || '' }}
      - name: Cache Playwright browser
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.65.2
      - name: Install browser for smoke tests
        run: uv run playwright install --only-shell chromium
      - name: Exercise Chromium and ingress over the running container
        run: uv run python tests/smoke.py --image ha-voxl-chromium:test
      - name: Prepare pinned vulnerability scanner
        run: docker build --pull -t "$TRIVY_IMAGE" ci
      - name: Scan fixable high and critical container vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v voxl-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 15m ha-voxl-chromium:test
      - name: Collect the effective patched Rust dependency lockfile
        run: |
          mkdir -p artifacts/dependency-scan
          id=$(docker create ha-voxl-chromium:test)
          trap 'docker rm "$id"' EXIT
          docker cp "$id:/usr/share/doc/voxl/Cargo.lock" artifacts/dependency-scan/Cargo.lock
      - name: Scan the actual Rust dependencies, not just OS packages
        run: |
          docker run --rm \
            -v "$PWD/artifacts/dependency-scan:/source:ro" \
            -v voxl-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 15m /source
