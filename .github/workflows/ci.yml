name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '47 8 * * 1'

permissions:
  contents: read

env:
  UV_LOCKED: 'true'
  TRIVY_IMAGE: ha-voxl-scanner:ci

jobs:
  metadata:
    name: Home Assistant add-on metadata lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./voxl_chromium
          community: false

  python:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  container:
    name: Native build and smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # One smoke subnet on the VM; hosted jobs have independent Docker daemons.
    concurrency:
      group: >-
        ${{ contains(matrix.runner, 'mu-voxl-amd64') && 'voxl-mu-amd64-smoke' || format('voxl-hosted-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.arch) }}
      cancel-in-progress: false
    env:
      VOXL_JOB_TEMP_NAME: voxl-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            # PRs, automation branches, forks and release tags stay GitHub-hosted.
            runner: >-
              ${{ fromJSON(github.repository == 'ColeMundus/ha-voxl-chromium' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["self-hosted","linux","x64","mu-voxl-amd64"]' || '["ubuntu-24.04"]') }}
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Clean persistent workspace before checkout
        if: contains(matrix.runner, 'self-hosted')
        shell: bash
        run: |
          workspace=$(realpath -- "${GITHUB_WORKSPACE:?}")
          runner_temp=$(realpath -- "${RUNNER_TEMP:?}")
          job_temp=$(realpath -m -- "$runner_temp/${VOXL_JOB_TEMP_NAME:?}")
          [[ "$workspace" != / && "$workspace" != "$HOME" ]]
          [[ "$job_temp" == "$runner_temp"/voxl-* ]]
          sudo -n find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo -n rm -rf -- "$job_temp"
      - name: Prepare job temporary directory
        shell: bash
        run: |
          job_temp="${RUNNER_TEMP:?}/${VOXL_JOB_TEMP_NAME:?}"
          mkdir -p -- "$job_temp"
          printf 'TMPDIR=%s\n' "$job_temp" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - name: Build ephemeral source image (never pushed or uploaded)
        run: docker build -t ha-voxl-chromium:test voxl_chromium
      - name: Install browser for smoke tests
        run: uv run playwright install --with-deps chromium
      - name: Exercise Chromium and ingress over the running container
        run: uv run python tests/smoke.py --image ha-voxl-chromium:test
      - name: Prepare pinned vulnerability scanner
        run: docker build --pull -t "$TRIVY_IMAGE" ci
      - name: Scan fixable high and critical container vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v voxl-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 15m ha-voxl-chromium:test
      - name: Collect the effective patched Rust dependency lockfile
        run: |
          mkdir -p artifacts/dependency-scan
          id=$(docker create ha-voxl-chromium:test)
          trap 'docker rm "$id"' EXIT
          docker cp "$id:/usr/share/doc/voxl/Cargo.lock" artifacts/dependency-scan/Cargo.lock
      - name: Scan the actual Rust dependencies, not just OS packages
        run: |
          docker run --rm \
            -v "$PWD/artifacts/dependency-scan:/source:ro" \
            -v voxl-trivy-cache:/root/.cache/ \
            "$TRIVY_IMAGE" fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 15m /source
      - name: Clean persistent workspace after job
        if: always() && contains(matrix.runner, 'self-hosted')
        shell: bash
        run: |
          workspace=$(realpath -- "${GITHUB_WORKSPACE:?}")
          runner_temp=$(realpath -- "${RUNNER_TEMP:?}")
          job_temp=$(realpath -m -- "$runner_temp/${VOXL_JOB_TEMP_NAME:?}")
          [[ "$workspace" != / && "$workspace" != "$HOME" ]]
          [[ "$job_temp" == "$runner_temp"/voxl-* ]]
          sudo -n find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo -n rm -rf -- "$job_temp"
