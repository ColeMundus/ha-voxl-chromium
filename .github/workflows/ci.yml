name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '47 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: 'true'
  TRIVY_IMAGE: ha-voxl-scanner:ci

jobs:
  checks:
    name: Lint, format, add-on, hassfest and HACS
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start budget clock
        id: budget
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - name: Path selection
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${AFFECTED_BASE}"
          fi
          python3 scripts/ci_affected.py checks
      - name: ruff check
        id: ruff
        continue-on-error: true
        run: uv run ruff check .
      - name: ruff format
        id: ruff-format
        continue-on-error: true
        run: uv run ruff format --check .
      - name: addon-linter
        id: addon
        continue-on-error: true
        uses: frenck/action-addon-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./voxl_chromium
          community: false
      - name: hassfest
        id: hassfest
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/github/workspace" \
            ghcr.io/home-assistant/hassfest@sha256:f9ac52cfe0f7b8770334f191e6713aa9f10f0906a989bd38d75a4933534144c7
      - name: HACS
        id: hacs
        continue-on-error: true
        uses: docker://ghcr.io/hacs/action@sha256:187499a09c5d41f9f0d42ff80d203ed87b974c028290140913b61e005fb0aab2
        with:
          category: integration
          github_token: ${{ github.token }}
          comment: false
      - name: Report every failed check
        if: always()
        run: |
          set -euo pipefail
          failed=()
          for pair in \
            "ruff check:${{ steps.ruff.outcome }}" \
            "ruff format:${{ steps.ruff-format.outcome }}" \
            "addon-linter:${{ steps.addon.outcome }}" \
            "hassfest:${{ steps.hassfest.outcome }}" \
            "HACS:${{ steps.hacs.outcome }}"
          do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            echo "$name $outcome"
            if [[ "$outcome" != "success" ]]; then
              echo "::error title=$name::$name failed ($outcome)"
              failed+=("$name")
            fi
          done
          if (( ${#failed[@]} )); then
            echo "Failed checks: ${failed[*]}"
            exit 1
          fi
      - name: Enforce time budget
        if: always()
        env:
          START: ${{ steps.budget.outputs.start }}
          LIMIT: "180"
        run: bash scripts/ci_budget.sh

  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start budget clock
        id: budget
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${AFFECTED_BASE}"
          fi
          uv run python scripts/ci_affected.py unit | tee -a "$GITHUB_OUTPUT"
      - run: mkdir -p artifacts && uv run pytest --junitxml=artifacts/unit-junit.xml
      - name: Prove every unit test file ran
        run: python3 scripts/prove_test_files.py artifacts/unit-junit.xml 'tests/test_*.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_call'
        with:
          name: unit-test-times
          path: artifacts/unit-junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce time budget
        if: always()
        env:
          START: ${{ steps.budget.outputs.start }}
          LIMIT: "60"
        run: bash scripts/ci_budget.sh

  integration:
    name: Home Assistant integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start budget clock
        id: budget
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked --project integration_tests
      - id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${AFFECTED_BASE}"
          fi
          uv run python scripts/ci_affected.py integration | tee -a "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.decision == 'affected'
        run: mkdir -p artifacts && uv run --project integration_tests pytest integration_tests --junitxml=artifacts/integration-junit.xml
      - name: Prove every integration test file ran
        if: steps.scope.outputs.decision == 'affected'
        run: python3 scripts/prove_test_files.py artifacts/integration-junit.xml 'integration_tests/test_*.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.scope.outputs.decision == 'affected' && (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_call')
        with:
          name: integration-test-times
          path: artifacts/integration-junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck with ty
        run: uv run --project integration_tests ty check
      - name: List pyright diagnostics ty does not report
        run: uv run --project integration_tests python scripts/typecheck_gap.py
      - name: Enforce time budget
        if: always()
        env:
          START: ${{ steps.budget.outputs.start }}
          LIMIT: "120"
        run: bash scripts/ci_budget.sh

  container:
    name: Native build and smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Start budget clock
        id: budget
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: false
      - run: uv sync --locked
      - id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AFFECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${AFFECTED_BASE}"
          fi
          uv run python scripts/ci_affected.py native | tee -a "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.scope.outputs.decision == 'affected'
        with:
          driver: docker-container
      - name: Build ephemeral source image (never pushed or uploaded)
        if: steps.scope.outputs.decision == 'affected'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: voxl_chromium
          load: true
          push: false
          tags: ha-voxl-chromium:test
          provenance: false
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          # A GitHub Actions layer cache is not a registry push. Pull requests
          # only read. Main and the weekly schedule write, and they rebuild
          # the apt stages so the vulnerability scan sees current packages.
          cache-to: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=native-{0}', matrix.arch) || '' }}
          pull: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
          no-cache-filters: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') && 'builder-apt,runtime-apt' || '' }}
      - name: Cache Playwright browser
        if: steps.scope.outputs.decision == 'affected'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.65.2
      - name: Install browser for smoke tests
        if: steps.scope.outputs.decision == 'affected'
        run: uv run playwright install --only-shell chromium
      - name: Exercise Chromium and ingress over the running container
        if: steps.scope.outputs.decision == 'affected'
        run: uv run python tests/smoke.py --image ha-voxl-chromium:test
      - name: Prepare pinned vulnerability scanner
        if: steps.scope.outputs.decision == 'affected'
        run: docker build --pull -t "$TRIVY_IMAGE" ci
      - name: Trivy database day
        id: trivy-day
        if: steps.scope.outputs.decision == 'affected'
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      # The first run on a day saves the database. Later runs restore it.
      - name: Restore vulnerability database
        id: trivy-cache
        if: steps.scope.outputs.decision == 'affected'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-db
          key: trivy-db-${{ matrix.arch }}-${{ steps.trivy-day.outputs.day }}
          restore-keys: |
            trivy-db-${{ matrix.arch }}-
      - name: Scan fixable high and critical container vulnerabilities
        if: steps.scope.outputs.decision == 'affected'
        run: |
          mkdir -p "${{ runner.temp }}/trivy-db"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "${{ runner.temp }}/trivy-db:/root/.cache/" \
            "$TRIVY_IMAGE" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 15m ha-voxl-chromium:test
      - name: Collect the effective patched Rust dependency lockfile
        if: steps.scope.outputs.decision == 'affected'
        run: |
          mkdir -p artifacts/dependency-scan
          id=$(docker create ha-voxl-chromium:test)
          trap 'docker rm "$id"' EXIT
          docker cp "$id:/usr/share/doc/voxl/Cargo.lock" artifacts/dependency-scan/Cargo.lock
      - name: Scan the actual Rust dependencies, not just OS packages
        if: steps.scope.outputs.decision == 'affected'
        run: |
          docker run --rm \
            -v "$PWD/artifacts/dependency-scan:/source:ro" \
            -v "${{ runner.temp }}/trivy-db:/root/.cache/" \
            "$TRIVY_IMAGE" fs --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --timeout 15m /source
      - name: Make the vulnerability database readable
        if: steps.scope.outputs.decision == 'affected' && steps.trivy-cache.outputs.cache-hit != 'true'
        run: sudo chmod -R a+rX "${{ runner.temp }}/trivy-db"
      - name: Save vulnerability database
        if: >-
          steps.scope.outputs.decision == 'affected' &&
          steps.trivy-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'pull_request' ||
           (github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' || github.event_name == 'schedule')))
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/trivy-db
          key: ${{ steps.trivy-cache.outputs.cache-primary-key }}
      - name: Enforce time budget
        if: always()
        env:
          START: ${{ steps.budget.outputs.start }}
          # Pull-request native jobs hit the layer cache. Run 45286171554
          # finished in 100s (amd64) and 107s (aarch64). Main and the schedule
          # rebuild the apt stages and write the cache; run 45286630604 took
          # 313s and 267s. A 35s budget cannot fit apt, one cargo build, and
          # smoke, so those runs get 600s and pull requests get 240s.
          LIMIT: ${{ github.event_name == 'pull_request' && '240' || '600' }}
        run: bash scripts/ci_budget.sh
