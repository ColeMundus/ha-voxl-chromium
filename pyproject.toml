[project]
name = "ha-voxl-chromium"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.14,<1", "playwright>=1.56,<2"]

[tool.pytest.ini_options]
pythonpath = ["voxl_chromium", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
