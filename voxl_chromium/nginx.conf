pid /tmp/nginx.pid;
error_log stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8099;
        server_name _;
        # Never trust X-Forwarded-For to authorize access. Only the TCP peer.
        allow 172.30.32.2;
        deny all;
        client_max_body_size 100m;
        location = /healthz {
            allow 127.0.0.1;
            allow 172.30.32.2;
            deny all;
            proxy_pass http://127.0.0.1:6901/healthz;
        }
        location / {
            proxy_pass http://127.0.0.1:6901;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:6901;
            # Ingress already authorizes requests. Keep voxl's host/origin check
            # private to this proxy instead of enabling wildcard trust upstream.
            proxy_set_header Origin http://127.0.0.1:6901;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
    }
}
